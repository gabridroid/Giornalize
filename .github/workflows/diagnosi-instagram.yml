# Diagnosi dell'API di Instagram: si avvia a mano (scheda Actions).
# Scrive in data/diagnosi_instagram.json cosa può fare il codice di accesso,
# senza mai scrivere il codice stesso.

name: Diagnosi Instagram

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-giornalize
  cancel-in-progress: false

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chiedi a Meta cosa può fare il codice
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python -m giornalize diagnosi-instagram
      - name: Salva il risultato
        run: |
          git config user.name "giornalize-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnosi_instagram.json
          git diff --cached --quiet || git commit -q -m "Diagnosi Instagram"
          git pull -q --rebase --autostash origin main
          git push -q origin HEAD:main
