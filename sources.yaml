# ============================================================================
#  FONTI DI GIORNALIZE
# ============================================================================
#
#  Questo è l'unico file da modificare per aggiungere, togliere o correggere
#  una fonte. Ogni fonte è un blocco che inizia con "- id:".
#
#  Campi di ogni fonte:
#    id                  nome breve senza spazi né accenti, unico (es. "ilpost")
#    nome                nome come appare sul sito
#    categoria           una delle categorie definite in config.yaml
#    tipo                descrizione breve (es. "Quotidiano")
#    orientamento        etichetta di orientamento indicativa (testo completo)
#    orientamento_breve  (facoltativo) versione corta mostrata nel badge
#    sito                indirizzo del sito (o lasciare vuoto: "")
#    instagram           account Instagram con la @ (o lasciare vuoto: "")
#    instagram_da_verificare  true se l'account non è ancora stato controllato
#    feed                elenco di indirizzi RSS/Atom da leggere
#    sitemap             (facoltativo) elenco di "news sitemap" da leggere
#                        se il sito non ha un feed RSS
#    attiva              false per sospendere una fonte senza cancellarla
#
#  Se "feed" è vuoto o nessun feed risponde, il programma prova a trovarne
#  uno da solo partendo dal "sito" e scrive nel registro (data/stato_fonti.json)
#  quale indirizzo ha usato: conviene poi copiarlo qui.
#
#  ATTENZIONE agli spazi: YAML usa i rientri (2 spazi) per capire la struttura.
#  Copiate un blocco esistente e cambiate solo i valori.
#
#  Gli indirizzi dei feed segnati "# da provare" sono stati cercati ma non
#  ancora provati: vengono controllati automaticamente al primo avvio.
# ============================================================================

