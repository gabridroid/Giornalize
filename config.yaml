# ============================================================================
#  IMPOSTAZIONI DI GIORNALIZE
# ============================================================================
#  Qui si regolano le soglie e i comportamenti del sito.
#  Dopo una modifica, il sito si ricostruisce da solo al successivo
#  aggiornamento automatico (oppure subito, se il file viene modificato su
#  GitHub: vedi README).
# ============================================================================

sito:
  titolo: Giornalize
  sottotitolo: Le notizie del giorno messe a confronto, fonte per fonte.
  # Indirizzo pubblico del sito, quando sarà online (serve solo per i link
  # di condivisione). Esempio: https://nomeutente.github.io/giornalize/
  indirizzo: ""

raccolta:
  # Ogni quante ore si aggiorna il sito. È solo un'informazione mostrata
  # nella pagina "Come funziona": l'orario vero si imposta nel file
  # .github/workflows/aggiorna.yml (vedi README).
  ogni_quante_ore: 3
  # Quanto aspettare (in secondi) una fonte che non risponde.
  timeout_secondi: 20
  # Se tutti i feed di una fonte falliscono, provare a trovarne uno dal sito.
  scoperta_automatica: true
  # Per quanti giorni conservare le notizie raccolte.
  giorni_archivio: 3
  # Per quanti giorni conservare lo "storico" (data/storico/, un file al
  # giorno), usato dalla pagina "Temi da seguire".
  giorni_storico: 30
  # Quante notizie al massimo leggere da ogni singolo feed.
  max_notizie_per_feed: 80
  # Un feed la cui notizia più recente ha più di questi giorni è
  # considerato "fermo" (abbandonato): viene segnalato come errore e il
  # programma cerca un feed nuovo sul sito.
  giorni_feed_fermo: 7

estratto:
  # Lunghezza massima dell'estratto mostrato sotto il titolo.
  max_caratteri: 200

oggi:
  # Pagina "Oggi": le storie più raccontate delle ultime ore.
  finestra_ore: 24
  # Quante storie mostrare al massimo.
  max_storie: 10
  # Quante fonti diverse servono perché una storia possa comparire.
  min_fonti: 3
  # Quanti titoli mettere a confronto in ogni storia.
  titoli_a_confronto: 4
  # Quanti "filoni" (aspetti della storia, es. "decreto aiuti" e
  # "denunce") mostrare al massimo sotto ogni storia.
  max_filoni: 6
  # Il titolo di ogni storia è quello di un articolo vero: si sceglie prima
  # tra le fonti di queste categorie (di solito più neutre), poi tra le
  # fonti "non collocabili", infine tra tutte.
  titolo_preferito_da:
    - Agenzie e all-news

tutte:
  # Pagina "Tutte le notizie": tutto quello che è stato raccolto.
  finestra_ore: 48
  # Quante notizie "di una sola fonte" mostrare per ciascuna fonte.
  max_notizie_singole_per_fonte: 8

temi:
  # Pagina "Temi da seguire": i temi si scrivono nel file temi.yaml.
  # Quanti giorni indietro guardare (al massimo quanto giorni_storico).
  giorni: 30
  # Quanti giorni mostrare nella tabella "giorno per giorno".
  giorni_tabella: 14

raggruppamento:
  # Primo passaggio: quanto devono assomigliarsi due notizie per finire nello
  # stesso gruppo, da 0 (per niente) a 1 (identiche). Più alto = gruppi più
  # piccoli e precisi; più basso = gruppi più grandi ma con più errori.
  soglia_somiglianza: 0.30
  # Secondo passaggio: quanto devono assomigliarsi due gruppi per essere
  # riuniti nella stessa "storia" (es. "scontri a Milano" e "Piantedosi sui
  # danni"). Più basso = storie più ampie, ma più rischio di unire vicende diverse.
  soglia_storie: 0.18
  # Una notizia di una sola fonte entra in una storia solo se le somiglia
  # almeno così tanto.
  soglia_aggancio: 0.25
  # Quanto pesa il titolo rispetto all'estratto nel confronto.
  peso_titolo: 2
  # Quante parole chiave calcolare per ogni gruppo (uso interno del programma).
  parole_chiave: 4

filtri:
  # Notizie da non mostrare mai, per tutte le fonti: basta che l'indirizzo
  # contenga uno di questi pezzi (sport, spettacolo, video, comunicati...).
  escludi_indirizzi:
    - "/sport/"
    - "/calcio/"
    - "/spettacolo/"
    - "/spettacoli/"
    - "/cinema/"
    - "/musica/"
    - "/serie-tv/"
    - "/personaggi/"
    - "/gossip/"
    - "/people/"
    - "/oroscopo/"
    - "/motori/"
    - "/auto-moto-motori/"
    - "/cook/"
    - "/video/"
    - "/videogallery/"
    - "/video-verticali/"
    - "/tennis/"
    - "/ciclismo/"
    - "/basket/"
    - "/volley/"
    - "/fashion/"
    - "/moda/"
    - "festa-del-cinema"
    - "://d.repubblica.it"
    - "repubblica.it/en/"
    - "/video-news-by-vista/"
    - "://video."
    - "/il-medico-risponde/"
    - "/giochi/"
  # ...oppure il cui titolo corrisponde a una di queste espressioni
  # (maiuscole e minuscole non contano).
  escludi_titoli:
    - "^serie a\\b"
    - "ballando con le stelle"
    - "grande fratello"
    - "uomini e donne"
    - "\\boroscopo\\b"
    - "puntata del \\d"
    - "^(champions|europa league|conference league|motogp|moto ?gp|formula 1|f1)\\b"
    - "\\bhighlights\\b"
    - "^tg sport\\b"
  # ...oppure che il feed della fonte mette in una di queste sezioni
  # (serve per i giornali che non scrivono la sezione nell'indirizzo).
  escludi_sezioni_feed:
    - sport
    - calcio
    - tennis
    - motori
    - formula 1
    - motogp
    - spettacoli
    - spettacolo
    - cinema
    - musica
    - televisione
    - tv
    - gossip
    - oroscopo

fuori_dai_radar:
  # Sezione "Fuori dai radar": storie raccontate da fonti indipendenti e
  # poco presenti nei feed di agenzie e quotidiani nazionali.
  # Categorie che contano come "grandi giornali":
  categorie_grandi:
    - Agenzie e all-news
    - Quotidiani nazionali
  # Categorie che contano come fonti indipendenti, di inchiesta o social:
  categorie_alternative:
    - Testate online e settimanali
    - Inchiesta e fact-checking
    - Divulgatori social
  # Una storia compare se ne parlano ALMENO questo numero di fonti
  # alternative...
  min_fonti_alternative: 2
  # ...e AL MASSIMO questo numero di grandi giornali.
  max_fonti_grandi: 1
  # Una storia viene scartata se somiglia almeno così tanto (da 0 a 1) a una
  # storia che i grandi giornali hanno coperto. 0 = controllo spento.
  somiglianza_con_argomenti_coperti: 0.20
  # Segnalazioni di una sola fonte: ammesse solo da queste categorie
  # (mostrate a parte, in un elenco chiuso).
  segnalazioni_singole_da:
    - Inchiesta e fact-checking
  # Non contano per questa sezione: opinioni, rubriche, riepiloghi, dirette...
  escludi_indirizzi:
    - "/opinioni/"
    - "/opinione/"
    - "/commenti/"
    - "/commento/"
    - "/editoriali/"
    - "/editoriale/"
    - "/idee/"
    - "/idee-e-commenti/"
    - "/rubriche/"
    - "/blog/"
    - "/lettere/"
    - "/podcast/"
    - "/newsletter/"
    - "youtube.com/"
  escludi_titoli:
    - "rassegna stampa"
    - "prime pagine"
    - "le notizie (di oggi|del giorno|della settimana)"
    - "^\\d{1,2}/\\d{1,2}\\b"
    - "\\b\\d{1,2}/\\d{1,2}/\\d{2,4}\\b"
    - "\\blive\\b"
    - "\\bdiretta\\b"
    - "\\bpodcast\\b"

# Le aree politiche, su un solo asse da sinistra a destra, più "non
# collocabile" per le fonti che non si possono mettere su quell'asse.
# Sono indicative: vedi la pagina "Come funziona". Ogni fonte in
# sources.yaml ha il campo "area" con uno di questi nomi.
aree:
  - nome: sinistra
    colore: "#b5562b"
  - nome: centro-sinistra
    colore: "#e0965f"
  - nome: centro
    colore: "#8f9aa6"
  - nome: centro-destra
    colore: "#5fa3b8"
  - nome: destra
    colore: "#22708a"
  - nome: non collocabile
    colore: "#d6d2c8"

instagram:
  # Impostazioni dell'API ufficiale di Instagram (si attiva solo dopo aver
  # inserito i segreti INSTAGRAM_TOKEN e INSTAGRAM_ACCOUNT_ID su GitHub:
  # vedi README). Le fonti lette con l'API hanno "instagram_api: true".
  versione_api: v24.0
  # Quanti post recenti leggere per ogni account a ogni aggiornamento.
  post_per_account: 10

# Le categorie (tipi) di fonti. Il nome deve coincidere con il campo
# "categoria" in sources.yaml; singolare e plurale servono per i testi.
categorie:
  - nome: Agenzie e all-news
    singolare: agenzia o all-news
    plurale: agenzie e all-news
    colore: "#5b6b7f"
  - nome: Quotidiani nazionali
    singolare: quotidiano
    plurale: quotidiani
    colore: "#2f6fb0"
  - nome: Quotidiani locali
    singolare: quotidiano locale
    plurale: quotidiani locali
    colore: "#6b7f3a"
  - nome: Testate online e settimanali
    singolare: testata online
    plurale: testate online
    colore: "#2b8a6e"
  - nome: Inchiesta e fact-checking
    singolare: inchiesta/fact-checking
    plurale: inchiesta/fact-checking
    colore: "#b4532a"
  - nome: Divulgatori social
    singolare: divulgatore social
    plurale: divulgatori social
    colore: "#8a4fb0"
